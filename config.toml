# Deterministic classifier baseline. External helpers and OCR are explicit experiments.
[pipeline]
layers = []
optional_layers = []

[document_ingest]
fail_closed = true
min_pdf_text_chars = 20
min_pdf_chars_per_page = 20
max_empty_pdf_page_ratio = 0.2
reject_image_only_pdf = true

[image_scan]
provider = "none"

[public_evidence]
enabled = false
provider = "none"
max_results = 5
timeout_seconds = 8.0

[llm]
enabled = false
provider = "none"
base_url = "http://127.0.0.1:8001/v1"
model = "gpt-oss-20b"
timeout_seconds = 20.0
allow_remote_base_url = false
allow_remote_raw_text = false

[llm_helpers]
enabled = false
defined_terms_enabled = false
coverage_audit_enabled = false

[privacy]
external_query_policy = "sanitized_only"
max_query_chars = 180
redact_exact_numbers = true

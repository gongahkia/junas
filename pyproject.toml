[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "junas"
version = "0.1.0"
description = "Local PII/MNPI classification, document analysis, and accuracy evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "httpx>=0.27.0,<1.0",
  "pypdf>=4.0.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
ner = ["spacy>=3.7.0"]
ocr = ["pytesseract>=0.3.10", "pypdfium2>=4.30.0"]
cloud-ocr = ["boto3>=1.34.0", "google-cloud-vision>=3.7.0", "azure-ai-vision-imageanalysis>=1.0.0"]
dev = ["mypy>=1.11.2", "pytest>=8.0.0", "ruff>=0.6.9"]

[project.scripts]
junas = "junas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["junas*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"junas.review" = ["jurisdictions_data/*.toml"]
"junas.data.frequency" = ["MANIFEST.toml"]
"junas.data.frequency.SG" = ["*.csv"]
"junas.data.frequency.UK" = ["*.csv"]
"junas.data.frequency.AU" = ["*.csv"]
"junas.data.frequency.JP" = ["*.csv"]
"junas.data.frequency.KR" = ["*.csv"]
"junas.data.frequency.US" = ["*.csv"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]

[tool.ruff.lint.per-file-ignores]
"test/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
exclude = [
  "^reports/",
]

[[tool.mypy.overrides]]
module = ["junas.models", "junas.pipeline", "junas.cli", "junas.configs.runtime"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["test"]

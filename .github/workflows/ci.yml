name: Classifier CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read

jobs:
  core-tests:
    name: Classifier and document pipeline tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -q
      - run: uv build
      - run: uv run --frozen junas classify --text 'Contact alice@example.test'

  changed-python-quality:
    name: Changed Python format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - name: Check changed Python files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE_SHA="$PUSH_BASE"
          else
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$BASE_SHA" HEAD
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- '*.py' > changed-python-files.null
          if [ -s changed-python-files.null ]; then
            xargs -0 uv run --frozen ruff format --check < changed-python-files.null
            xargs -0 uv run --frozen ruff check < changed-python-files.null
          fi

  accuracy:
    name: Locked corpus accuracy and label provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python scripts/evaluate_accuracy.py --external skip
      - run: uv run --frozen python scripts/check_mnpi_conjunctive_provenance.py
      - name: Check reviewed label lock freshness
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          BASE_SHA="${PR_BASE:-$PUSH_BASE}"
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            uv run --frozen python scripts/check_promoted_lock_freshness.py --base-ref "$BASE_SHA" --head-ref HEAD
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-accuracy
          path: reports/current/core_accuracy.json

  local-ocr:
    name: Optional local OCR regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv sync --frozen --extra dev --extra ocr
      - run: uv run --frozen pytest -q test/test_tesseract_ocr.py test/test_image_scan.py test/test_core_pipeline.py

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_fixture_scrub.py

  external-accuracy:
    name: External PII breadth measurements
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: ./scripts/fetch_tab_fixture.sh
      - run: uv run --frozen python scripts/fetch_ai4privacy_fixture.py
      - run: uv run --frozen python scripts/evaluate_accuracy.py --external require
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-accuracy
          path: |
            reports/current/core_accuracy.json
            reports/current/core_tab_eval.json
            reports/current/core_ai4privacy_eval.json
